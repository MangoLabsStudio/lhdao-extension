name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version 由 package.json 的 packageManager 字段决定 (pnpm@10.8.1)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: WXT prepare (auto-imports + types)
        run: pnpm run compile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Build chrome-mv3
        run: pnpm run build

      - name: Build firefox-mv2
        run: pnpm run build:firefox
        continue-on-error: true # firefox 还没主流回归,失败不卡 PR

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: '.output/**/*'
          # .output/ 是 dot-prefixed dir,默认会被 upload-artifact 视作隐藏忽略
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
