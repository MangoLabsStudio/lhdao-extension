name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version 由 package.json 的 packageManager 字段决定 (pnpm@10.8.1)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: WXT prepare
        run: pnpm run compile

      - name: Build + zip (Chrome MV3)
        run: pnpm run zip

      - name: Build + zip (Firefox MV2)
        run: pnpm run zip -- -b firefox
        continue-on-error: true

      - name: List built zips
        run: ls -lah .output/*.zip || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            .output/*.zip
