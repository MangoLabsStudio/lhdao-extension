mutation MintProductExperienceTicket($campaignId: String!) {
  mintProductExperienceTicket(campaignId: $campaignId) {
    ticket
    macKey
    expiresAt
    ruleSetVersion
    allowedOrigins
    completionMode
    verificationMode
    rules {
      id
      title
      urlPattern
      selector
      condition {
        type
        expected
        attributeName
        minimumCount
        minimumValue
      }
    }
  }
}

mutation MintProductExperienceTestTicket($campaignId: String!) {
  mintProductExperienceTestTicket(campaignId: $campaignId) {
    ticket
    macKey
    expiresAt
    ruleSetVersion
    allowedOrigins
    completionMode
    verificationMode
    rules {
      id
      title
      urlPattern
      selector
      condition {
        type
        expected
        attributeName
        minimumCount
        minimumValue
      }
    }
  }
}

mutation SubmitProductExperienceProof(
  $input: SubmitProductExperienceProofInput!
) {
  submitProductExperienceProof(input: $input) {
    accepted
    code
    campaignId
    configVersion
    verificationKind
    verifiedAt
  }
}

mutation StartProductZkTlsProof($campaignId: String!, $ruleId: String!) {
  startProductZkTlsProof(campaignId: $campaignId, ruleId: $ruleId) {
    sessionId
    connectorId
    expiresAt
  }
}

mutation StartProductZkTlsTestProof($campaignId: String!, $ruleId: String!) {
  startProductZkTlsTestProof(campaignId: $campaignId, ruleId: $ruleId) {
    sessionId
    connectorId
    expiresAt
  }
}

query ProductZkTlsRuleProgress($campaignId: String!) {
  productZkTlsRuleProgress(campaignId: $campaignId) {
    ruleId
    title
    status
    current
    target
    unit
  }
}
