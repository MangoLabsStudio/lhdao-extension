<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.50"/>
      <stop offset="30%" stop-color="#00f5d4" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#00f5d4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="haloBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>
  </defs>

  <g transform="translate(64, 64)">
    <circle cx="0" cy="0" r="48" fill="url(#halo)" filter="url(#haloBlur)"/>

    <line x1="0" y1="0" x2="0" y2="-40" stroke="#00f5d4" stroke-width="6.8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="24.4" y2="-14" stroke="#00f5d4" stroke-width="6.8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="40.8" y2="11.7" stroke="#00f5d4" stroke-width="6.8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="23.3" stroke="#00f5d4" stroke-width="6.8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-27.2" y2="15.7" stroke="#00f5d4" stroke-width="6.8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-20.4" y2="-5.8" stroke="#00f5d4" stroke-width="6.8" stroke-linecap="round"/>
  </g>
</svg>
