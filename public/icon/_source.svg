<?xml version="1.0" encoding="UTF-8"?>
<!-- Extension toolbar icon source.
     Onyx rounded tile (matches the brand pill-plate) + centered burst icon
     scaled to ~80px on a 128 grid. See kol-dao-app/public/brand/ for the
     standalone burst-icon.svg this is derived from. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- onyx rounded tile (24 px radius ≈ 18.75% → consistent with the
       brand monogram tile recipe) -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="#08090F"/>

  <!-- burst icon, original viewBox 0 0 32 32, centered + scaled 2.5×
       (24px padding each side → 80×80 mark). Translation calc:
         scale 2.5 → 80×80 mark
         center at (64,64) → translate by (64 - 80/2, 64 - 80/2) = (24,24) -->
  <g transform="translate(24,24) scale(2.5)">
    <g fill="#5EEAD4">
      <path d="M16,16 L28.5,3.5 L28.5,9 L19,15 Z"/>
      <path d="M16,16 L3.5,3.5 L3.5,9 L13,15 Z"/>
      <path d="M16,16 L26,26 L26,22 L19,17 Z"/>
      <path d="M16,16 L6,26 L6,22 L13,17 Z"/>
    </g>
    <circle cx="16" cy="16" r="3" fill="#08090F"/>
    <circle cx="16" cy="16" r="1.8" fill="#00f5d4"/>
    <circle cx="16" cy="16" r="0.9" fill="#ffffff"/>
  </g>
</svg>
